<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="./../fontawesome-free-6.5.2-web/css/all.min.css"
    />
    

    <link rel="stylesheet" href="./CSS/bootstrap.min.css" />
    <link rel="stylesheet" href="./CSS/style.css" />
    <title>Game Over</title>
  </head>

  <body>
    <!-- Start of Home -->
    <div class="home  w-100  ">
      <section class="games" id="games">
        <header>
          <img src="./img/wraper.png" class="w-100" alt="Game" >
        </header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary  rounded-4">
          <div class="container-fluid">
            <img src="./img/logo-sm.png" width="40" alt="game logo">
            <a class="navbar-brand ps-1 text-white" href="#">GAME REVIEWS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll" aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarScroll">
              <ul class="navbar-nav ms-auto my-2 my-lg-0 navbar-nav-scroll">
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" data-category="mmorpg" href="#">MMORPG</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" data-category="shooter" href="#">SHOOTER</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" data-category="sailing" href="#">SAILING</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" data-category="permadeath" href="#">PERMADEATH</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" data-category="superhero" href="#">SUPERHERO</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" data-category="pixel" href="#">PIXEL</a>
                </li>
              
              </ul>
            </div>
          </div>
        </nav>


        <main class="container my-5">
          <section class="position-relative">
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 gx-4 gy-4" id="gameData">
            
            </div>
          </section>

        </main>

      </section>
      <!-- Start of Details Section -->
      <section class="details d-none" id="details">
        <div class="container">
           <header class="hstack justify-content-between">
              <h1 class="text-center h3 py-4 text-white">Details Game</h1>
              <button class="btn-close btn-close-white" id="btnClose"></button>
           </header>
           <div class="row g-4" id="detailsContent">



           

           
         
          
          
       

           </div>
           <div class="layer d-none  d-flex justify-content-center align-items-center position-fixed top-0 bottom-0 start-0 end-0 bg-black bg-opacity-50">
             <div class="inner w-50 position-relative d-flex align-items-center justify-content-between">
              <i class="text-white fa-solid fa-xmark position-absolute top-0 end-0 m-3"></i>
              <i class="text-white fa-solid fa-arrow-left p-2"></i>
              <i class="text-white fa-solid fa-arrow-right p-2"></i>

             </div>


           </div>
        </div>
     </section>
     <!-- End of details section -->




      <div class="d-none loader  mx-auto">
        <span class="loader"></span>
      </div>
      
     



     
    </div>
    <!-- End Of Home -->



 

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/index.js" type="module"></script>
  </body>
</html>
